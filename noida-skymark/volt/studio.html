<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Volt Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#141414;--card:#1f1f21;--ink:#f3efe8;--sub:#aaa49a;--line:rgba(255,255,255,.1);--orange:#dd8d36}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0d0d}
#stage canvas,#stage img.v{position:absolute;left:0;top:0;width:100%;height:calc(100% - 150px);object-fit:contain;transition:opacity .6s}
#stage img.v{opacity:0} #stage img.v.on{opacity:1}
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:3}
#top .logo{background:#fff;border-radius:10px;padding:6px 12px} #top .logo img{height:28px;display:block}
#top .t{flex:1;min-width:0} #top .t b{display:block;font-size:17px} #top .t small{color:var(--sub);font-size:12.5px}
#views{display:flex;gap:6px;flex-wrap:wrap} #views button{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.1);font-weight:600;font-size:12.5px} #views button.on{background:var(--ink);color:#141414}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(transparent,rgba(0,0,0,.75) 30%);padding:40px 18px calc(16px + env(safe-area-inset-bottom))}
#steps{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
#steps button{padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--sub);display:flex;gap:7px;align-items:center}
#steps button i{font-style:normal;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;background:rgba(255,255,255,.12)}
#steps button.on{background:var(--ink);color:#141414} #steps button.on i{background:var(--orange);color:#141414} #steps button.done i{background:#35d07f;color:#141414}
#panel{max-width:820px;margin:0 auto;background:rgba(31,31,33,.92);border:1px solid var(--line);border-radius:16px;padding:14px 16px;backdrop-filter:blur(10px)}
#panel h3{margin:0 0 4px;font-size:16px} #panel p{margin:0 0 10px;color:var(--sub);font-size:13px}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw button{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.18);position:relative}
.sw button.on{outline:3px solid var(--orange);outline-offset:3px}
.sw button span{position:absolute;left:50%;top:50px;transform:translateX(-50%);font-size:10.5px;color:var(--sub);white-space:nowrap;display:none}
.sw button:hover span,.sw button.on span{display:block}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.btn{color:var(--ink);padding:11px 16px;border-radius:12px;font-weight:700;font-size:13.5px;background:rgba(255,255,255,.12)} .btn.p{background:var(--orange);color:#141414} .btn.w{background:var(--ink);color:#141414}
#sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:6px 0 4px}
#sum div{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;font-size:13px} #sum div b{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.25)}
#pal{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} #pal button{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.1);font-weight:600;font-size:12.5px}
#hold{position:fixed;right:18px;top:76px;z-index:3;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.5);font-weight:700;font-size:12px;user-select:none}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:5;color:var(--sub)} #msg.show{display:flex}
#msg b{display:block;color:var(--ink);font-size:20px;margin-bottom:8px}
@media (max-width:700px){#top{flex-wrap:wrap}#views{width:100%}#steps button{padding:7px 10px;font-size:12px}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas><img class="v" id="vimg" alt=""></div>
<div id="top"><div class="logo"><img src="/media/noida-skymark/volt/volt-logo.png" alt="Volt"></div><div class="t"><b>Design studio</b><small id="vname">Volt, first floor, Skymark F-1</small></div><div id="views"></div></div>
<button id="hold">Hold to see as designed</button>
<div id="bottom"><div id="steps"></div><div id="panel"></div></div>
<div id="msg"><div><b>The studio pictures are being rendered</b>They come from Blender on the studio Mac (volt-blender, "4 Design studio.command"). Once they are uploaded this page shows them.</div></div>
<script type="module" src="./studio.js"></script>
</body>
</html>
