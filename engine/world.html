<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Explorer · Autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090b; --ink:#f4f3ef; --mut:rgba(244,243,239,.66); --dim:rgba(244,243,239,.42); --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.08);
  --acc:#c6f24a; --acc-ink:#0d1203; --glass:rgba(12,14,16,.52);
  --l1:#3d8fd6; --l3:#2bb3a6; --l7:#e2584f; --rail:#e0784f;
  --disp:'Barlow Condensed',Impact,sans-serif; --font:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.8,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;color:var(--ink);font:14px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 90% at 60% 40%,#3a3d40 0%,#1c1e21 45%,#0b0c0e 100%)}
body.walk{background:#0b0c0e}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
.mono{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.scrim{position:fixed;left:0;top:0;bottom:0;width:min(560px,60vw);pointer-events:none;z-index:1;background:linear-gradient(90deg,rgba(6,7,8,.72),rgba(6,7,8,.35) 55%,rgba(6,7,8,0))}

/* top */
#top{position:fixed;left:28px;right:28px;top:22px;z-index:5;display:flex;align-items:center;gap:18px;pointer-events:none}
#top > *{pointer-events:auto}
#brand{margin-right:auto;display:flex;flex-direction:column;gap:6px}
#brand .mono{color:var(--dim)}
#brand b{font:700 22px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase}
#modes{display:flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#modes button{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font:600 13px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
#modes button svg{width:15px;height:15px}
#modes button.on{background:var(--acc);color:var(--acc-ink)}
#to-map{padding:10px 14px;border-radius:999px;border:1px solid var(--line);font:600 13px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);background:var(--glass)}
#to-map:hover{color:var(--ink);border-color:var(--ink)}

/* the building: a heads-up column, no panel */
#hud{position:fixed;left:28px;top:96px;bottom:178px;width:min(470px,calc(100vw - 56px));z-index:4;display:flex;flex-direction:column;overflow:hidden}
#hud .eyebrow{display:flex;gap:10px;align-items:center;color:var(--mut)}
.chip{padding:4px 8px;border-radius:5px;font:500 10.5px/1 var(--mono);letter-spacing:.1em;background:var(--acc);color:var(--acc-ink)}
#name{margin:10px 0 8px;font:700 clamp(46px,6.2vw,82px)/.9 var(--disp);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
#line1{color:var(--ink);font-size:14.5px;margin:0}
#line2{color:var(--mut);font-size:13.5px;margin:4px 0 0}
#conn{margin-top:22px}
#conn .mono{color:var(--dim);margin-bottom:10px}
.row{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line2)}
.row:last-of-type{border-bottom:1px solid var(--line2)}
.row .dot{width:9px;height:9px;border-radius:50%}
.row b{display:block;font:600 19px/1.05 var(--disp);letter-spacing:.05em;text-transform:uppercase}
.row i{font-style:normal;font-size:12px;color:var(--dim)}
.row .v{text-align:right;font:700 30px/1 var(--disp);letter-spacing:.02em}
.row .v small{font:600 13px/1 var(--disp);letter-spacing:.1em;color:var(--mut);margin-left:3px}
.row .v em{display:block;font:500 11px/1.4 var(--mono);font-style:normal;color:var(--dim);letter-spacing:.06em}
.row.on b,.row.on .v{color:var(--acc)}
.row:hover b{color:var(--acc)}
#go{margin-top:18px;align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:13px 18px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font:700 15px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase}
#go:hover{filter:brightness(1.08)}
#src{margin-top:12px;font-size:11.5px;color:var(--dim);max-width:420px}
#more{margin-top:10px;align-self:flex-start;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:3px}
#spec{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:12.5px;overflow:auto;padding-right:8px}
#spec dt{color:var(--dim)} #spec dd{margin:0}
#photo{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);max-width:420px}
#photo img{display:block;width:100%}
#photo span{display:block;padding:6px 10px;font:500 10.5px/1.3 var(--mono);color:var(--dim);background:rgba(0,0,0,.4)}

/* the seven: a filmstrip */
#strip{position:fixed;left:28px;right:28px;bottom:22px;z-index:5;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#strip::-webkit-scrollbar{display:none}
.film{flex:0 0 196px;position:relative;height:122px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#16181b center/cover no-repeat;text-align:left;transition:transform .35s var(--ease),border-color .2s}
.film::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.82))}
.film > span{position:absolute;left:12px;right:12px;bottom:10px;z-index:1}
.film .n{display:block}
.film .n{font:500 10.5px/1 var(--mono);letter-spacing:.12em;color:var(--mut)}
.film b{display:block;margin-top:5px;font:700 18px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.film i{display:block;margin-top:4px;font:500 11px/1 var(--mono);font-style:normal;color:var(--acc)}
.film:hover{transform:translateY(-3px)}
.film.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}

/* labels in the scene */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lb{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.lb.bld{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%)}
.lb.bld b{padding:7px 12px;border-radius:8px;background:var(--acc);color:var(--acc-ink);font:700 15px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase}
.lb.bld i{width:1px;height:26px;background:var(--acc)}
.lb.st{transform:translate(-50%,-100%);display:flex;gap:7px;align-items:center;padding:5px 9px 5px 6px;border-radius:7px;background:rgba(10,12,14,.72);border:1px solid var(--line);font:600 13px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
.lb.st em{font:600 10px/1 var(--mono);font-style:normal;padding:3px 5px;border-radius:4px;color:#fff}
.lb.dist{transform:translate(-50%,-50%);padding:6px 10px;border-radius:999px;background:rgba(10,12,14,.78);border:1px solid var(--acc);color:var(--acc);font:700 14px/1 var(--disp);letter-spacing:.08em}

/* walking */
#walkhud{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);z-index:5;display:flex;gap:26px;align-items:flex-end;padding:14px 22px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#walkhud div{display:flex;flex-direction:column;gap:6px}
#walkhud .mono{color:var(--dim)}
#walkhud b{font:700 34px/1 var(--disp);letter-spacing:.02em}
#walkhud b small{font:600 14px/1 var(--disp);color:var(--mut);letter-spacing:.1em;margin-left:3px}
#compass{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:5;font:600 13px/1 var(--disp);letter-spacing:.2em;color:var(--mut)}
#mini{position:fixed;right:28px;bottom:170px;z-index:5;width:190px;height:190px;border-radius:50%;border:1px solid var(--line);background:rgba(10,12,14,.6)}
#hint{position:fixed;left:50%;top:116px;transform:translateX(-50%);z-index:5;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;color:var(--mut);transition:opacity .8s}

/* the route walk */
#route{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);z-index:6;width:min(760px,calc(100vw - 56px));padding:18px 22px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#route .top{display:flex;align-items:flex-end;gap:16px}
#route .top div{margin-right:auto}
#route .mono{color:var(--dim)}
#route h4{margin:6px 0 0;font:700 32px/1 var(--disp);letter-spacing:.03em;text-transform:uppercase}
#route .big{font:700 46px/.9 var(--disp);color:var(--acc);text-align:right}
#route .big small{display:block;font:500 11px/1.4 var(--mono);color:var(--dim);letter-spacing:.1em}
#route .track{position:relative;height:3px;border-radius:3px;background:rgba(255,255,255,.18);margin:16px 6px 8px}
#route .track i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:3px}
#route .track b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(198,242,74,.25)}
#route .ends{display:flex;justify-content:space-between}
#route .ctl{display:flex;gap:8px}
#route .ctl button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font:600 12px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
#route .ctl button:hover{color:var(--ink);border-color:var(--ink)}

#credit{position:fixed;right:28px;top:66px;z-index:2;max-width:420px;text-align:right;font:400 10.5px/1.4 var(--mono);color:var(--dim)}

/* loading and sign-in */
#load,#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#08090b center/cover no-repeat}
#load::before,#gate::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,7,8,.35),rgba(6,7,8,.88))}
.box{position:relative;width:min(440px,calc(100vw - 40px));padding:4px}
.box h1{margin:10px 0 8px;font:700 54px/.92 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.box p{margin:0 0 18px;color:var(--mut)}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
#gate input{width:100%;margin:0 0 10px;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.45);color:var(--ink);font:14px var(--font)}
#gate .go{width:100%;padding:13px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font:700 16px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase}
#g-err{color:#ff9a8a;font-size:12.5px;min-height:18px;margin:8px 0 0}
#veil{position:fixed;inset:0;z-index:8;background:#08090b;opacity:0;pointer-events:none;transition:opacity .45s}
#veil.on{opacity:1}

body.walk #hud,body.walk .scrim,body.walk #strip{display:none}
body.walk #walkhud,body.walk #route{bottom:24px} body.walk #mini{bottom:24px}
body.routing #walkhud,body.routing #hint{display:none}
@media (max-width:900px){
  #hud{top:auto;bottom:160px;max-height:46dvh;overflow:auto;padding-right:6px}
  .scrim{width:100vw;background:linear-gradient(0deg,rgba(6,7,8,.85),rgba(6,7,8,.2) 60%,rgba(6,7,8,0))}
  #name{font-size:44px} #credit{display:none} #mini{width:120px;height:120px;bottom:160px;right:16px}
  .film{flex-basis:150px;height:96px}
  #top{left:16px;right:16px} #strip{left:16px;right:16px}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div class="scrim"></div>
<div id="labels"></div>

<header id="top" hidden>
  <div id="brand"><span class="mono" id="t-eyebrow">Autopilot · Flipkart</span><b id="t-title">Andheri East</b></div>
  <nav id="modes" aria-label="View">
    <button data-mode="dollhouse" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg>Dollhouse</button>
    <button data-mode="walk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M10 22l2-7 3 3v6M8 12l3-4 3 2 3 1M11 8l-1 6"/></svg>Walk</button>
  </nav>
  <a id="to-map" href="/">2D map</a>
</header>

<section id="hud" hidden>
  <div class="eyebrow"><span class="mono" id="h-eyebrow"></span><span class="chip" id="h-prio" hidden></span></div>
  <h1 id="name"></h1>
  <p id="line1"></p><p id="line2"></p>
  <div id="conn"></div>
  <button id="go" hidden></button>
  <p id="src"></p>
  <button id="more">Property details</button>
  <dl id="spec" hidden></dl>
  <figure id="photo" hidden><img alt=""><span>Rendered in Blender (Cycles) from the same model</span></figure>
</section>

<div id="credit"></div>
<nav id="strip" aria-label="Buildings" hidden></nav>

<div id="walkhud" hidden></div>
<div id="compass" hidden></div>
<canvas id="mini" width="380" height="380" hidden></canvas>
<div id="hint" hidden>Drag to look around · W A S D or arrows to walk · click the ground to go there</div>
<div id="route" hidden></div>
<div id="veil"></div>

<div id="load"><div class="box"><div class="mono" style="color:var(--acc)">Autopilot · Explorer</div><h1 id="l-title">Andheri East</h1><p id="l-msg">Loading the model.</p><div class="bar"><i id="l-bar"></i></div></div></div>
<div id="gate" hidden><form class="box" id="g-form" autocomplete="on"><div class="mono" style="color:var(--acc)">Autopilot · Explorer</div><h1>Sign in</h1><p>Use the access ID and password you were given.</p>
  <input id="g-id" placeholder="Access ID" autocomplete="username" required><input id="g-pw" type="password" placeholder="Password" autocomplete="current-password" required>
  <button class="go" type="submit">Enter</button><div id="g-err"></div></form></div>

<script type="importmap">{"imports":{"three":"/engine/vendor/three/three.module.min.js","three/addons/":"/engine/vendor/three/jsm/"}}</script>
<script type="module" src="/engine/world.js"></script>
</body>
</html>
