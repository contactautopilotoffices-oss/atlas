<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Andheri floor plans · Autopilot</title><style>
:root{
  --bg:#e9e5de; --paper:#fbfaf7; --ink:#1d1c1a; --sub:#5d5852; --mute:#9a948b; --card:rgba(252,250,247,.92); --line:rgba(30,28,25,.10);
  --accent:#2f6fe8; --r:16px; --shadow:0 10px 30px rgba(40,30,20,.14),0 2px 6px rgba(40,30,20,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.glass{background:var(--card);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.6);box-shadow:var(--shadow);border-radius:var(--r)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);font-weight:700}
#left{position:fixed;left:16px;top:16px;width:300px;z-index:6;padding:14px}
#brand{display:flex;align-items:center;gap:10px;margin:0 0 10px}
#brand img{height:22px;display:block}
#brand .for{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);font-weight:700;border-left:1px solid var(--line);padding-left:10px;line-height:1.25}
#left h1{margin:2px 0 4px;font-size:20px;letter-spacing:-.01em}
#left .lede{font-size:12.5px;color:var(--sub);margin:0 0 10px}
.fl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:12px;background:rgba(0,0,0,.04);margin:6px 0;transition:background .15s}
.fl:hover{background:rgba(47,111,232,.12)} .fl b{font-size:18px;font-weight:800;width:26px;color:var(--accent)}
.fl span{font-weight:700} .fl small{display:block;font-weight:600;color:var(--sub);font-size:12px}
.fl .go{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent)}
#route{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-top:8px;padding:10px;border-radius:12px;background:#eef3fd}
#route i{width:22px;height:5px;border-radius:3px;background:var(--accent);flex:none}
#route b{display:block} #route small{color:var(--sub);font-weight:600}
#route.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;padding:8px 14px;font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap}
#load{position:fixed;right:16px;bottom:16px;z-index:5;padding:7px 12px;font-size:12px;font-weight:600;color:var(--sub);opacity:0;transition:opacity .3s}
#load.show{opacity:1}
.tag{position:fixed;left:0;top:0;z-index:4;pointer-events:none;transform:translate(-50%,-100%);white-space:nowrap}
.tag div{background:#fff;border-radius:10px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);font-weight:700;font-size:12.5px}
.tag small{display:block;color:var(--sub);font-weight:600;font-size:11.5px}
.tag:after{content:"";display:block;width:2px;height:16px;background:#fff;margin:0 auto;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tag.st div{background:var(--accent);color:#fff} .tag.st small{color:#dbe6ff} .tag.st:after{background:var(--accent)}
/* 2D plan */
#plan{position:fixed;inset:0;z-index:10;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .28s ease}
#plan.on{opacity:1;pointer-events:auto}
#svgwrap{position:absolute;left:0;top:0;bottom:0;right:380px;touch-action:none;cursor:grab}
#svgwrap.drag{cursor:grabbing}
#svg{width:100%;height:100%;display:block}
#ptop{position:absolute;left:16px;top:16px;z-index:2;display:flex;gap:10px;align-items:center;padding:8px 10px}
#ptop button.back{padding:7px 12px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:13px}
#ptop h2{margin:0;font-size:16px} #ptop small{display:block;color:var(--sub);font-size:11.5px;font-weight:600}
#zoom{position:absolute;right:396px;bottom:16px;z-index:2;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:10px;font-size:18px;font-weight:700}
#side{position:absolute;right:0;top:0;bottom:0;width:380px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column}
#side .head{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
#side .tot{display:flex;gap:18px;margin-top:6px} #side .tot div b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em} #side .tot div span{font-size:11.5px;color:var(--sub);font-weight:600}
#mode{display:flex;gap:4px;margin:14px 18px 6px;padding:4px;background:#f1eee9;border-radius:12px}
#mode button{flex:1;padding:9px 8px;border-radius:9px;font-weight:700;font-size:13px;color:var(--sub)}
#mode button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
#sel{padding:14px 18px;border-bottom:1px solid var(--line);display:none}
#sel.on{display:block}
#sel h3{margin:0 0 2px;font-size:20px;display:flex;align-items:center;gap:9px} #sel h3 i{width:14px;height:14px;border-radius:4px;flex:none}
#sel .big{display:flex;gap:10px;margin:10px 0 6px}
#sel .big div{flex:1;background:#f6f4f0;border-radius:12px;padding:10px 12px} #sel .big b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1} #sel .big span{font-size:11.5px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
#sel table{width:100%;border-collapse:collapse;font-size:13px} #sel td{padding:5px 0;border-top:1px solid var(--line)} #sel td:last-child{text-align:right;font-weight:700}
#sel .note{font-size:12px;color:#a4541a;margin-top:6px}
#list{flex:1;overflow:auto;padding:6px 10px 14px;scrollbar-width:thin}
#list .row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 8px;border-radius:9px;font-size:13px}
#list .row:hover{background:#f3f1ed} #list .row.cur{background:#eaf0fd}
#list .row i{width:12px;height:12px;border-radius:3px;flex:none} #list .row span{font-weight:600}
#list .row em{margin-left:auto;font-style:normal;font-weight:700} #list .row small{color:var(--sub);width:74px;text-align:right;font-weight:600}
#list .grp{padding:10px 8px 4px}
#foot{padding:8px 18px 12px;font-size:11px;color:var(--mute);border-top:1px solid var(--line)}
.z{cursor:pointer;transition:opacity .2s} .z path.f{transition:fill-opacity .2s}
svg text{font-family:Inter,system-ui,sans-serif;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
@media (max-width:820px){ #svgwrap{right:0;bottom:44%} #side{left:0;width:auto;top:56%;border-left:0;border-top:1px solid var(--line)} #zoom{right:12px;bottom:calc(44% + 12px)} #left{width:auto;right:16px} }
</style><link rel="stylesheet" href="/airoli-rtp/demo/css/presentation.css"><style>
[hidden]{display:none!important}#svgwrap{top:150px;bottom:58px}#plan{opacity:1;pointer-events:auto}#ptop{right:calc(var(--side-width,380px) + 16px);flex-wrap:wrap;max-width:none}#ptop h2{font-size:17px}#variant-controls{display:flex;gap:8px;align-items:center;margin-left:auto}#variant-controls label{font-size:11px;font-weight:650;color:var(--sub)}#variant-controls select{font:600 12px Inter,system-ui;padding:8px 26px 8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:180px}#view3d{font-size:12px;font-weight:700;padding:9px 12px;border-radius:8px;background:var(--ink);color:#fff}#error{position:fixed;inset:0;z-index:30;display:grid;place-content:center;background:var(--paper);padding:32px}#error a{color:var(--accent)}@media(max-width:820px){#svgwrap{bottom:calc(47% + 45px)}#ptop{right:12px}#ptop h2{font-size:13px}#variant-controls{width:100%;margin:0 3px}#variant-controls label{font-size:10px}#variant-controls select{font-size:11px;padding:6px;max-width:140px}#view3d{margin-left:auto;font-size:11px;padding:7px 10px}}
#ptop{right:auto;max-width:calc(100vw - 32px)}#svgwrap{top:86px}.room-feedback input{display:block;width:100%;margin:4px 0 8px;padding:6px}.room-feedback textarea{display:block;width:100%;min-height:60px;margin:6px 0}.room-feedback button{background:#234acc;color:white;border-radius:6px;padding:7px}.room-feedback summary{cursor:pointer;color:#284da1}.room-feedback output{display:block}.room-key{padding:8px 12px;font-weight:700;background:#eef2f5}.room-key i{display:inline-block;width:10px;height:10px;margin-right:8px}.z{pointer-events:all}#labz,#labi{pointer-events:none}</style></head><body><div id="plan">
  <div id="svgwrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="ptop" class="glass"><button class="back" id="back">‹ Property</button><div><div class="plan-eyebrow">Autopilot · Flipkart · Andheri</div><h2 id="ptitle"></h2><small id="psub" hidden></small></div></div>
  <div class="plan-instruction">Drag to pan <span>·</span> Scroll to zoom <span>·</span> Select a space to inspect</div>
  <div id="zoom"><button class="glass" id="zin" title="Zoom in" aria-label="Zoom in">+</button><button class="glass" id="zout" title="Zoom out" aria-label="Zoom out">−</button><button class="glass" id="zfit" title="Whole floor" aria-label="Fit the whole floor" style="font-size:13px">⤢</button></div>
  <div id="side">
    <div class="inspector-heading"><img class="plan-brand" src="/airoli-rtp/brand/autopilot-wordmark-white.png" alt="Autopilot"><div class="k">Plan explorer</div><h2>The floor, in detail</h2><p>Select a process or supporting space to see its seats, dimensions and area.</p></div>
    <div id="mode"><button data-m="req" class="on">Seats &amp; spaces</button><button data-m="inv">Inventory</button></div>
    <div id="sel"></div>
    <div class="list-columns" aria-hidden="true"><span>Space</span><span>Seats</span><span>Area</span></div>
    <div id="list"></div>
    <div id="foot"></div>
  </div>
</div>
<section id="error" hidden><h1>Floor plans</h1><p id="error-msg"></p><a href="/flipkart-andheri/world">Return to the property explorer →</a></section><script type="module" src="/engine/cad.js"></script></body></html>
