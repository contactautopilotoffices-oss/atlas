<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Total Environment Descent</title>
<meta name="viewport" content="width=1920,height=1080">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>
<script src="config.local.js"></script>
<style>
  @font-face { font-family: 'Inter'; font-weight: 500; src: url(fonts/inter-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
  :root { --te: #a24a2c; --te-soft: rgba(162, 74, 44, .22); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1018; }
  body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #map, #clouds, #grade, #ov { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #clouds, #grade, #ov { pointer-events: none; }
  .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib, .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right { display: none !important; }
  #grade { background: radial-gradient(120% 95% at 50% 46%, rgba(8,14,24,0) 52%, rgba(8,14,24,.30) 100%),
    linear-gradient(180deg, rgba(10,18,30,.08) 0%, rgba(10,18,30,0) 26%, rgba(10,18,30,0) 70%, rgba(10,18,30,.18) 100%); }
  #credit { position: absolute; right: 28px; bottom: 22px; font: 500 13px/1 'Inter'; color: rgba(255,255,255,.78); text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .gl { position: absolute; left: 0; top: 0; white-space: nowrap; color: #fff; will-change: transform, opacity; text-shadow: 0 1px 2px rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.35); }
  .gl.caps { font: 500 15px/1 'Inter'; letter-spacing: .42em; text-transform: uppercase; }
  .gl.big { font: 600 30px/1 'Inter'; letter-spacing: .5em; text-transform: uppercase; }
  .gl.small { font: 500 13px/1 'Inter'; letter-spacing: .32em; text-transform: uppercase; color: rgba(255,255,255,.86); }
  .gl .tick { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #fff; margin-right: 12px; vertical-align: middle; box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
  .pin { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
  .pin .ring { position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.9); transform: scale(0); opacity: 0; }
  .pin .dot { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px var(--te), 0 0 0 9px var(--te-soft), 0 2px 10px rgba(0,0,0,.45); transform: scale(0); }
  .pin .drop { position: absolute; left: 0; bottom: 0; width: 0; will-change: transform, opacity; }
  .pin .stem { position: absolute; left: -.75px; bottom: 0; width: 1.5px; transform-origin: 50% 100%; background: linear-gradient(0deg, rgba(255,255,255,.15), rgba(255,255,255,.95)); }
  .pin .card { position: absolute; bottom: 0; left: 0; transform: translate(-50%, 0); white-space: nowrap; padding: 13px 20px 14px 18px; border-radius: 14px; display: flex; align-items: center; gap: 13px;
    background: rgba(13,18,28,.52); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(18px) saturate(1.35); -webkit-backdrop-filter: blur(18px) saturate(1.35);
    box-shadow: 0 18px 40px -12px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.08); }
  .pin .card .acc { width: 8px; height: 8px; border-radius: 50%; background: #e07a4f; flex: none; box-shadow: 0 0 0 4px rgba(224,122,79,.18); }
  .pin .card b { display: block; font: 600 23px/1.1 'Inter'; color: #fff; letter-spacing: -.005em; }
  .pin .card small { display: block; font: 500 13px/1 'Inter'; color: rgba(255,255,255,.66); letter-spacing: .16em; text-transform: uppercase; margin-top: 7px; }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="clouds"></canvas>
<div id="grade"></div>
<div id="ov"></div>
<div id="credit">© Mapbox © OpenStreetMap © Maxar</div>
<script type="module" src="descent.js"></script>
</body>
</html>
