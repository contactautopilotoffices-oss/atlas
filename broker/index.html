<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2a1e16">
<title>Broker updates · Autopilot</title>
<link rel="icon" href="/autopilot-logo-trimmed.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe7dc; --paper:#faf6f0; --card:#fff; --ink:#2a1e16; --mut:#6c5b4d; --dim:#9a8878;
  --line:rgba(60,40,25,.13); --line2:rgba(60,40,25,.07);
  --acc:#a3502c; --acc2:#c8693a; --accbg:rgba(163,80,44,.09);
  --ok:#2e7d5b; --okbg:rgba(46,125,91,.1); --warnbg:rgba(183,121,31,.12); --bad:#b23b2a; --badbg:rgba(178,59,42,.08);
  --serif:'Playfair Display',Georgia,serif;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --e1:0 1px 2px rgba(42,30,22,.08); --e2:0 18px 48px rgba(42,30,22,.22);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.mut{color:var(--mut)} .small{font-size:13px}

header{position:sticky;top:0;z-index:10;background:#21170f;color:#efe4d6;padding:12px 16px calc(12px);display:flex;align-items:center;gap:12px}
header img{width:92px;height:auto;filter:invert(1) brightness(1.4)}
header .tag{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#e9b48f}
header .who{margin-left:auto;font-size:13px;color:#d9ccbd;text-align:right;line-height:1.3}
main{max-width:720px;margin:0 auto;padding:18px 16px 80px}
h1{font:500 28px/1.15 var(--serif);margin:4px 0 6px}
.lead{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--e1);padding:16px;margin-bottom:12px}
h2{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.in{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;margin-bottom:12px}
.in:focus{border-color:var(--acc2);outline:none;box-shadow:0 0 0 3px var(--accbg)}
textarea.in{min-height:90px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 5px}
label.f .opt{font-weight:400;color:var(--dim)}
.props{display:flex;flex-direction:column;gap:8px}
.prop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:13px 14px;cursor:pointer;box-shadow:var(--e1)}
.prop:hover{border-color:rgba(163,80,44,.35)}
.prop .nm{font-weight:600}
.prop .sb{font-size:13px;color:var(--mut)}
.prop .go{margin-left:auto;color:var(--acc);font-size:20px;flex:none}
.prop .ct{font-size:12px;background:var(--okbg);color:var(--ok);border-radius:999px;padding:1px 8px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 16px;font-size:15px;cursor:pointer;min-height:46px}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.new{display:flex;gap:12px;align-items:center;border:1px dashed var(--acc2);background:var(--paper);border-radius:12px;padding:14px;cursor:pointer;width:100%;text-align:left}
.new b{display:block}
.sub{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.sub:last-child{border-bottom:0}
.st{border-radius:999px;padding:1px 9px;font-size:12px;white-space:nowrap}
.st.pending{background:var(--warnbg);color:#8a5a12} .st.approved{background:var(--okbg);color:var(--ok)} .st.rejected{background:var(--line2);color:var(--mut)}
.empty{padding:20px;text-align:center;color:var(--mut)}
.err{color:var(--bad);font-size:14px;min-height:20px}
.pill{display:inline-block;font-size:12px;background:var(--line2);border-radius:999px;padding:1px 8px;color:var(--mut)}

/* the form sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(31,22,16,.5);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .s{background:var(--paper);width:min(640px,100%);max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;box-shadow:var(--e2);padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet h3{font:500 22px/1.2 var(--serif);margin:0 0 2px}
#sheet .x{float:right;border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;color:var(--mut);padding:0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (min-width:700px){ #sheet{align-items:center} #sheet .s{border-radius:18px} }
@media (max-width:520px){ .grid2{grid-template-columns:1fr} h1{font-size:25px} }
.done{text-align:center;padding:26px 8px}
.done .tick{width:58px;height:58px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px;font-size:30px}
.foot{font-size:12.5px;color:var(--dim);text-align:center;margin-top:28px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:var(--e2);max-width:92vw}
</style>
</head>
<body>
<header>
  <img src="/autopilot-logo-trimmed.png" alt="Autopilot" width="319" height="44">
  <span class="tag">Broker updates</span>
  <div class="who" id="who"></div>
</header>
<main id="main"><div class="empty">Opening your link…</div></main>
<div id="sheet" role="dialog" aria-modal="true"><div class="s" id="sheet-body"></div></div>
<div id="toast" hidden></div>
<script src="/atlas-cms.js?v=cms1"></script>
<script src="./app.js?v=cms1"></script>
</body>
</html>
