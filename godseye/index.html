<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>God's Eye · Autopilot</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="../autopilot-logo-trimmed.png"/>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>
<script src="../config.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#070a10; --s1:#0f141d; --s2:#151b26; --s3:#1b2230;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.05);
  --txt:#fff; --mut:rgba(255,255,255,.72); --dim:rgba(255,255,255,.48);
  --acc:#2fbf71; --acc-ink:#04150c; --link:#8fc4f0; --bad:#ff9d8a;
  /* Signal groups. Categorical slots 1 to 5 of the validated dark palette,
     checked against --s1 (all adjacent pairs pass CVD and normal-vision
     floors). "Other" is neutral grey, never a sixth hue. Every mark that uses
     these also carries its group name as text. */
  --g-funding:#3987e5; --g-gcc:#d95926; --g-grow:#199e70; --g-lease:#c98500; --g-comp:#d55181; --g-other:#7d8594;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --num:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --ease:cubic-bezier(.32,.72,0,1);
  --shadow:0 10px 30px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.04) inset;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px}
body{min-height:100vh;background:radial-gradient(1400px 700px at 60% -20%,#10213b 0%,transparent 60%),var(--bg)}
a{color:var(--link);text-decoration-color:rgba(143,196,240,.35);text-underline-offset:2px}
a:hover{text-decoration-color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid rgba(120,190,255,.9);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(1000px 600px at 50% 30%,#111a29,#05070b)}
#gate .box{width:min(380px,100%);padding:30px 26px;background:var(--s1);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
#gate h1{margin:0 0 4px;font-size:18px;letter-spacing:.4px}
#gate h1 span{color:var(--mut);font-weight:400}
#gate p{margin:0 0 18px;color:var(--mut);font-size:12.5px;line-height:1.55}
#gate input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font:inherit;outline:none;margin-bottom:10px}
#gate input:focus{border-color:rgba(47,191,113,.6)}
#g-err{color:var(--bad);font-size:12px;min-height:16px;margin-top:9px}
.btn{border:none;border-radius:9px;padding:9px 15px;font-weight:650;cursor:pointer;background:linear-gradient(135deg,#2fbf71,#1d9c5a);color:var(--acc-ink);white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--mut);font-weight:500;border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.13);color:#fff}
#gate .btn{width:100%;padding:11px}

/* ---------- shell ---------- */
#app{display:none}
#app.on{display:block}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 20px;
  background:rgba(7,10,16,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--line2)}
.eye{width:28px;height:28px;flex:none}
.brand .t{font-weight:750;font-size:15px;letter-spacing:.5px}
.brand .t span{color:var(--mut);font-weight:400;letter-spacing:0}
.brand .s{color:var(--dim);font-size:11px;margin-top:1px}
header .sp{flex:1}
.health{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.live{background:var(--acc)}
/* pulses once per real refresh, never ambient */
.dot.ping{animation:ping 1.2s var(--ease) 1}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(47,191,113,.7)}100%{box-shadow:0 0 0 12px rgba(47,191,113,0)}}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:16px;padding:16px 20px 24px;align-items:start}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:baseline;gap:10px;padding:14px 16px 0}
.ch h2{margin:0;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);font-weight:650}
.ch .sub{font-size:11.5px;color:var(--dim)}
.ch .sp{flex:1}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{padding:14px 14px 13px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:hover{background:var(--s2)}
.kpi.on{border-color:rgba(255,255,255,.35)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,transparent)}
.kpi .l{font-size:11.5px;color:var(--mut);display:flex;gap:6px;align-items:center}
.kpi .v{font-size:30px;font-weight:700;margin-top:6px;letter-spacing:-.5px;line-height:1}
.kpi .f{font-size:11px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.city .v{font-size:22px;letter-spacing:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- map ---------- */
.mapcard{position:relative;overflow:hidden}
#map{height:min(520px,58vh);border-radius:0 0 var(--r) var(--r)}
.mapempty{height:min(520px,58vh);display:flex;align-items:center;justify-content:center;color:var(--mut);padding:24px;text-align:center;line-height:1.6}
.legend{position:absolute;left:14px;bottom:14px;z-index:2;background:rgba(10,14,21,.86);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:11px;color:var(--mut);line-height:1.7;max-width:270px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.legend b{color:#fff;font-weight:600}
.lg{display:flex;align-items:center;gap:8px}
.lg i{display:inline-block;flex:none}
.lg .bub{width:14px;height:14px;border-radius:50%;background:rgba(236,241,255,.55);border:2px solid #0f141d;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.lg .ring{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}
.lg .pin{width:16px;height:16px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
.legend .note{color:var(--dim);margin-top:4px;line-height:1.45}
.citychip{position:absolute;right:14px;top:56px;z-index:2}
.betpin{width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;
  border:2px solid #0f141d;box-shadow:0 0 0 1.5px var(--acc),0 6px 16px rgba(0,0,0,.5);cursor:pointer}
.mapboxgl-ctrl-attrib{font-size:10px}

/* ---------- charts ---------- */
.row2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.chart{padding:10px 16px 14px}
.chart svg{display:block;width:100%;overflow:visible}
.keys{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 16px 0;font-size:11.5px;color:var(--mut)}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.axis{fill:var(--dim);font-size:10.5px;font-family:var(--num)}
.lbl{fill:var(--mut);font-size:11.5px}
.val{fill:#fff;font-size:11px;font-family:var(--num)}
.grid line{stroke:rgba(255,255,255,.06)}
.seg{cursor:pointer;transition:opacity .15s}
.seg:hover{opacity:.8}
.rowhit{cursor:pointer}
.rowhit:hover rect.hl{fill:rgba(255,255,255,.04)}
.rounds{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;padding:6px 16px 14px}
.rounds h3{font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin:10px 0 6px}
.round{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line2)}
.round .amt{font-family:var(--num);font-weight:700;color:#fff;font-size:13px}
.round .t{font-size:12.5px;color:var(--mut);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.round .t a{color:var(--mut);text-decoration:none}
.round .t a:hover{color:#fff;text-decoration:underline}
.empty{padding:22px 16px;color:var(--dim);font-size:12.5px;line-height:1.6}

/* ---------- side panel ---------- */
.side{position:sticky;top:66px;height:calc(100vh - 82px);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line2);flex:none}
.tab{flex:1;border:none;background:transparent;color:var(--mut);padding:9px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px}
.tab:hover{background:rgba(255,255,255,.05);color:#fff}
.tab.on{background:rgba(255,255,255,.1);color:#fff}
.tab .c{font-family:var(--num);font-size:11px;color:var(--dim);margin-left:4px;font-weight:500}
.pane{display:none;flex-direction:column;min-height:0;flex:1}
.pane.on{display:flex}
.filters{padding:10px 12px 8px;border-bottom:1px solid var(--line2);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mut);border-radius:999px;padding:4px 10px;font-size:11.5px;cursor:pointer;
  display:inline-flex;gap:6px;align-items:center;min-height:26px}
.chip:hover{background:rgba(255,255,255,.1);color:#fff}
.chip.on{background:rgba(255,255,255,.92);color:#0b0f16;border-color:transparent;font-weight:650}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip .c{font-family:var(--num);font-size:10.5px;opacity:.65}
.frow{display:flex;gap:8px;margin-top:8px}
.frow input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;font:inherit;font-size:12.5px;outline:none}
#feed{overflow:auto;flex:1;padding:4px 6px 10px}
.item{padding:10px 10px 10px 13px;border-radius:10px;border-left:3px solid var(--gc,transparent);margin:4px 0;background:transparent}
.item:hover{background:rgba(255,255,255,.035)}
.item.pinned{background:rgba(47,191,113,.08)}
.meta{font-size:11px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.meta b{color:var(--mut);font-weight:550}
.meta .amt{font-family:var(--num);color:#fff;font-weight:650}
.hl{display:block;font-size:13px;line-height:1.4;color:#fff;text-decoration:none;margin-top:3px}
.hl:hover{text-decoration:underline}
.irow{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.06);color:var(--mut);display:inline-flex;gap:5px;align-items:center}
.tag i{width:6px;height:6px;border-radius:2px}
.tag.city{background:rgba(143,196,240,.12);color:#cfe6ff;cursor:pointer}
.irow .sp{flex:1}
.mini{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mut);border-radius:7px;padding:3px 9px;font-size:11px;cursor:pointer}
.mini:hover{background:rgba(255,255,255,.12);color:#fff}
.mini.on{background:rgba(47,191,113,.2);color:#9ff0c3;border-color:rgba(47,191,113,.4)}
.srcs{padding:8px 12px;border-top:1px solid var(--line2);font-size:10.5px;color:var(--dim);line-height:1.6;flex:none;max-height:64px;overflow:auto}
.srcs .bad{color:var(--bad)}

/* ---------- desk ---------- */
.dbody{overflow:auto;flex:1;padding:12px 14px 18px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.ask{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.ask textarea{width:100%;min-height:64px;resize:vertical;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;font:inherit;font-size:13px;line-height:1.5;outline:none}
.ask textarea:focus{border-color:rgba(47,191,113,.55)}
.askrow{display:flex;gap:8px;align-items:center}
.askrow .hint{flex:1;font-size:11px;color:var(--dim)}
.pins{margin-top:8px;font-size:12px;color:var(--mut);display:none;gap:8px;align-items:center}
.pins.on{display:flex}
.banner{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5;background:rgba(224,169,31,.1);border:1px solid rgba(224,169,31,.35);color:#f5d68a}
.log{margin-top:12px;font-family:var(--num);font-size:11px;color:var(--dim);line-height:1.75;max-height:120px;overflow:auto;border-left:2px solid var(--line);padding-left:10px}
.log .now{color:var(--mut)}
.verdict{margin-top:14px;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,rgba(47,191,113,.16),rgba(47,191,113,.04));border:1px solid rgba(47,191,113,.35);font-size:14px;line-height:1.6}
.verdict .k{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:#9ff0c3;font-weight:700;margin-bottom:4px}
.bet{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--s2);overflow:hidden}
.bet .bh{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.bet .rank{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.bet .name{flex:1;font-weight:650;font-size:14.5px;line-height:1.3}
.bet .where{font-size:11px;color:var(--dim);font-weight:400;margin-top:2px}
.score{text-align:right;flex:none}
.score .n{font-family:var(--num);font-size:20px;font-weight:750;line-height:1}
.score .d{font-size:10px;color:var(--dim)}
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:5px;width:64px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:2px}
.bet .bb{padding:6px 14px 12px;font-size:13px;line-height:1.55;color:rgba(255,255,255,.88)}
.bet .field{padding:6px 0;border-top:1px solid var(--line2)}
.bet .field:first-child{border-top:none}
.bet .field .fl{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);font-weight:650;margin-bottom:1px}
.bet .field.move{background:rgba(47,191,113,.07);margin:4px -14px;padding:8px 14px;border-top:none}
.bet .field.move .fl{color:#9ff0c3}
.parts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 0 2px}
.part .pl{font-size:10px;color:var(--dim);display:flex;justify-content:space-between}
.part .pl b{color:var(--mut);font-family:var(--num);font-weight:600}
.part .meter{width:100%}
.report{margin-top:12px;font-size:13.5px;line-height:1.62;color:rgba(255,255,255,.9)}
.report h2{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.report h3{font-size:14px;margin:14px 0 6px}
.report ul,.report ol{margin:6px 0 10px;padding-left:18px}
.report li{margin:4px 0}
.report p{margin:8px 0}
.report strong{color:#fff}
.report code{font-family:var(--num);font-size:12px;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px}
.err{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,120,100,.1);border:1px solid rgba(255,120,100,.35);color:var(--bad);font-size:12.5px}
details.sources{margin-top:16px;border-top:1px solid var(--line2);padding-top:10px;font-size:12px}
details.sources summary{cursor:pointer;color:var(--mut)}
details.sources ol{padding-left:18px;color:var(--dim);line-height:1.6}
.foot{margin-top:10px;font-size:10.5px;color:var(--dim);font-family:var(--num)}
.recent{margin-top:18px;border-top:1px solid var(--line2);padding-top:10px}
.recent h4{margin:0 0 4px;font-size:10.5px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase;font-weight:650}
.recent button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--mut);padding:6px 0;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--line2)}
.recent button:hover{color:#fff}
.recent small{color:var(--dim);margin-left:6px}

/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:60;pointer-events:none;background:rgba(12,16,24,.96);border:1px solid rgba(255,255,255,.14);border-radius:10px;
  padding:9px 11px;font-size:12px;color:var(--mut);max-width:300px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:none;line-height:1.5}
#tip .tt{color:#fff;font-weight:650;margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:8px}
#tip .tr i{width:12px;height:2px;border-radius:1px;display:inline-block}
#tip .tr b{color:#fff;font-family:var(--num);min-width:24px;text-align:right}
#tip .th{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.mapboxgl-popup{display:none}


/* ---------- React build additions ---------- */
.mapwrap{position:relative;margin-top:12px}
.kpi.skeleton{height:92px;cursor:default;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1))}
.pane[hidden]{display:none}
.rowhit .hl{fill:transparent}
.rowhit:hover .hl,.rowhit.sel .hl{fill:rgba(255,255,255,.05)}
.rowhit{cursor:pointer}
.empty.tight{padding:8px 0}
.tablewrap{padding:8px 16px 14px;overflow:auto}
.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th{text-align:left;font-weight:600;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:6px 8px;border-bottom:1px solid var(--line2);color:var(--mut);font-family:var(--num)}
.dt td:first-child{font-family:var(--font);color:#fff}
.bet .bh{width:100%;background:none;border:none;border-bottom:1px solid var(--line2);text-align:left;color:inherit;font:inherit}
.bet .bh:disabled{cursor:default}
.bet .bh:not(:disabled):hover{background:rgba(255,255,255,.03)}
.bet .name{display:flex;flex-direction:column}
.score{display:flex;flex-direction:column;align-items:flex-end}
.tag.city{border:none;font:inherit;font-size:10.5px}
.betpin{border:2px solid #0f141d;padding:0}
button.chip:disabled{opacity:.5;cursor:default}

/* ---------- responsive ---------- */
@media (max-width:1280px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .wrap{grid-template-columns:minmax(0,1fr) 400px} }
@media (max-width:1020px){
  .wrap{grid-template-columns:1fr}
  .side{position:static;height:auto;max-height:none}
  #feed,.dbody{max-height:70vh}
}
@media (max-width:720px){
  header{padding:10px 16px;gap:10px}
  .brand .s,.health .long,.health span:not(.dot),header .btn.ghost{display:none}
  .wrap{padding:12px 16px 20px;gap:12px}
  .main{gap:12px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .v{font-size:24px}
  .row2,.rounds{grid-template-columns:1fr}
  #map,.mapempty{height:62vh}
  .legend{left:10px;right:10px;bottom:10px;max-width:none}
  .parts{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px">God's Eye needs JavaScript.</p></noscript>
<script src="./dist/app.js"></script>
</body>
</html>
